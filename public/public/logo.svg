<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <defs>
    <clipPath id="circleClip">
      <circle cx="320" cy="320" r="310"/>
    </clipPath>
  </defs>

  <!-- Белый круг с тонким серым контуром -->
  <circle cx="320" cy="320" r="318" fill="#e2e8f0" opacity="0.15"/>
  <circle cx="320" cy="320" r="310" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Красная огненная «M» -->
  <g clip-path="url(#circleClip)">
    <!-- Левое пламя-ствол -->
    <path d="
      M 150 480
      Q 120 430 135 360
      Q 155 280 185 220
      Q 210 170 245 140
      L 275 115
      Q 295 105 320 95
      Q 330 92 340 90
      L 285 160
      Q 260 195 240 235
      Q 220 280 215 320
      Q 210 365 225 395
      Q 240 430 270 455
      L 150 480
    " fill="#cc2222" opacity="0.75"/>

    <!-- Правое пламя-ствол -->
    <path d="
      M 490 480
      Q 520 430 505 360
      Q 485 280 455 220
      Q 430 170 395 140
      L 365 115
      Q 345 105 320 95
      Q 310 92 300 90
      L 355 160
      Q 380 195 400 235
      Q 420 280 425 320
      Q 430 365 415 395
      Q 400 430 370 455
      L 490 480
    " fill="#cc2222" opacity="0.75"/>

    <!-- Центральное пламя (язык) -->
    <path d="
      M 320 100
      Q 280 170 260 250
      Q 240 330 250 390
      Q 260 430 290 460
      Q 310 475 320 480
      Q 330 475 350 460
      Q 380 430 390 390
      Q 400 330 380 250
      Q 360 170 320 100
    " fill="#dd3333" opacity="0.55"/>

    <!-- Верхний бутон пламени (лево) -->
    <path d="
      M 200 400
      Q 160 340 175 270
      Q 190 210 220 170
      Q 240 145 265 135
      L 250 155
      Q 230 180 215 220
      Q 200 270 200 320
      Q 200 360 200 400
    " fill="#bb1818" opacity="0.55"/>

    <!-- Верхний бутон пламени (право) -->
    <path d="
      M 440 400
      Q 480 340 465 270
      Q 450 210 420 170
      Q 400 145 375 135
      L 390 155
      Q 410 180 425 220
      Q 440 270 440 320
      Q 440 360 440 400
    " fill="#bb1818" opacity="0.55"/>

    <!-- Буква «М» поверх пламени — жёсткий тёмный шрифт -->
    <g fill="#1a1a1a" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
      <!-- Левая вертикаль -->
      <rect x="225" y="130" width="38" height="320" rx="5" fill="#1e1e1e" transform="rotate(-3 225 290)"/>
      <!-- Правая вертикаль -->
      <rect x="370" y="130" width="38" height="320" rx="5" fill="#1e1e1e" transform="rotate(3 380 290)"/>
      <!-- Левый наклонный элемент -->
      <polygon points="245,160 300,380 330,380 270,160" fill="#222222"/>
      <!-- Правый наклонный элемент -->
      <polygon points="355,160 400,160 400,380 340,380" fill="#222222" transform="rotate(0 370 270)"/>
    </g>

    <!-- Центральный V-образный элемент -->
    <g fill="#222222" stroke="#111111" stroke-width="3">
      <polygon points="265,370 320,470 375,370" fill="#1a1a1a"/>
      <polygon points="285,370 320,440 355,370" fill="#222222"/>
    </g>

    <!-- Дополнительные тени для объёма буквы М -->
    <g fill="#0d0d0d" opacity="0.15">
      <rect x="235" y="165" width="22" height="280" rx="4" transform="rotate(-2 235 305)"/>
      <rect x="383" y="165" width="22" height="280" rx="4" transform="rotate(2 383 305)"/>
    </g>

    <!-- Нижний язык огня (красная деталь) -->
    <path d="
      M 320 485
      Q 275 510 250 530
      Q 235 540 240 550
      Q 255 545 275 535
      Q 295 525 320 530
      Q 345 525 365 535
      Q 385 545 400 550
      Q 405 540 390 530
      Q 365 510 320 485
    " fill="#cc2222" opacity="0.8"/>
  </g>
</svg>
